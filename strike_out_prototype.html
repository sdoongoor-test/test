<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Strike Out – Prize Wall Prototype</title>
<style>
  :root{
    --gold:#ffba18;
    --gold2:#ff7a00;
    --deep:#061850;
    --blue:#0839bc;
    --blue2:#0b63ff;
    --ink:#03091f;
    --panelCount:8;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 50% 0%, #17265a 0 12%, #090f2d 45%, #030613 100%);
    color:#fff;
    font-family:Impact, Haettenschweiler, "Arial Narrow Bold", Arial, sans-serif;
    overscroll-behavior:none;
  }
  body{
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:10px 10px 58px;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:min(100vw - 20px, 506px);
    height:min(calc((100vw - 20px) * 16 / 9), calc(100svh - 78px));
    max-width:506px;
    aspect-ratio:9/16;
    overflow:hidden;
    border-radius:18px;
    background:
      linear-gradient(90deg, #071f72 0 13%, #082ca1 13% 16%, #03091e 16% 84%, #082ca1 84% 87%, #071f72 87%),
      radial-gradient(circle at 50% 40%, #0d42dc 0, #041447 55%, #020818 100%);
    box-shadow:
      0 0 0 2px #2b1800,
      0 0 0 4px #ffc028,
      0 22px 70px #000a;
    isolation:isolate;
    touch-action:manipulation;
  }
  .stage::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:
      linear-gradient(90deg, transparent 0 14%, #1758ff33 15%, transparent 16% 84%, #1758ff33 85%, transparent 86%),
      radial-gradient(circle at 50% 3%, #1c55ff55 0 8%, transparent 28%),
      linear-gradient(#0b1b5c22, transparent 20%, transparent 80%, #001f6a66);
    z-index:0;
  }
  .stage.strike-flash::after,
  .stage.reward-flash::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    z-index:50;
  }
  .stage.strike-flash::after{ animation:redPulse .48s ease-out; }
  .stage.reward-flash::after{ animation:goldPulse .40s ease-out; }

  @keyframes redPulse{
    0%{background:#ff001111; box-shadow:inset 0 0 0 0 #ff183500}
    25%{background:#ff001f55; box-shadow:inset 0 0 80px 18px #ff173f66}
    100%{background:transparent; box-shadow:inset 0 0 0 0 transparent}
  }
  @keyframes goldPulse{
    0%{background:#ffd90000}
    35%{background:#ffd90028}
    100%{background:transparent}
  }

  /* ---------- marquee ---------- */
  .marquee{
    position:relative;
    z-index:5;
    height:22.8%;
    min-height:0;
    background:
      radial-gradient(circle at 50% 28%, #1e63ff 0 13%, #0b2a90 42%, #071241 70%),
      linear-gradient(#07184e,#06103a);
    border-bottom:4px solid #ff9a00;
    box-shadow:0 4px 0 #5c2600, 0 10px 24px #000a;
  }
  .marquee-rim{
    position:absolute; inset:0;
    border-radius:50% 50% 0 0 / 24% 24% 0 0;
    border-top:6px solid #ffad00;
    box-shadow:inset 0 5px 0 #ffe260, inset 0 13px 0 #5d2500;
    overflow:hidden;
  }
  .bulbs{
    position:absolute; inset:5px 5px auto;
    height:20px;
    display:flex; align-items:center; justify-content:space-around;
    pointer-events:none;
  }
  .bulb{
    width:9px; height:9px; border-radius:50%;
    background:#ffd452;
    box-shadow:0 0 7px #ff7a00, 0 0 12px #ffd41a;
    animation:twinkle 1.25s ease-in-out infinite alternate;
  }
  .bulb:nth-child(3n){animation-delay:.25s}
  .bulb:nth-child(4n){animation-delay:.55s}
  @keyframes twinkle{from{filter:brightness(.8)}to{filter:brightness(1.7)}}

  .title-wrap{
    position:absolute; left:50%; top:11%;
    transform:translateX(-50%);
    width:60%;
    text-align:center;
    filter:drop-shadow(0 6px 0 #2b1200) drop-shadow(0 10px 12px #0008);
  }
  .title{
    margin:0;
    font-size:clamp(34px, 10.2vw, 67px);
    line-height:.78;
    letter-spacing:.5px;
    color:#fff7db;
    -webkit-text-stroke:2px #10224d;
    text-shadow:
      0 0 0 #10224d,
      0 3px 0 #ffc334,
      0 6px 0 #8f3b00,
      0 0 13px #ffcf3f88;
  }
  .title span{
    display:block;
    color:#fff8e8;
  }
  .title .strike{
    color:#fff3ce;
    background:linear-gradient(#fffbdc 0 18%, #ffc935 52%, #ff8d00 92%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-stroke:2px #0c2358;
  }
  .subtitle{
    margin:6px auto 0;
    width:max-content;
    max-width:95%;
    padding:2px 16px 3px;
    border:2px solid #ffb31c;
    border-radius:5px;
    background:linear-gradient(#173b97,#0a1b5d);
    color:#fff;
    font-family:Arial Black, Arial, sans-serif;
    font-size:clamp(11px,3vw,18px);
    letter-spacing:1px;
    box-shadow:inset 0 0 0 2px #5c2600, 0 3px 0 #4f1d00;
  }

  .hud{
    position:absolute;
    left:3.5%; right:3.5%; bottom:5%;
    display:grid;
    grid-template-columns:31% 1fr 31%;
    gap:4%;
    align-items:end;
  }
  .hudbox{
    min-height:59px;
    border:2px solid #ffad16;
    border-radius:9px;
    background:linear-gradient(#07194c,#030b25);
    box-shadow:inset 0 0 0 2px #5d2500, 0 5px 12px #0009;
    text-align:center;
    padding:5px 4px 6px;
  }
  .hudlabel{
    font-family:Arial Black, Arial, sans-serif;
    font-size:clamp(10px,2.7vw,16px);
    letter-spacing:.5px;
    line-height:1;
  }
  .bank-value{
    margin-top:3px;
    font-size:clamp(24px,7.6vw,45px);
    line-height:1;
    color:#fff1a6;
    text-shadow:0 2px 0 #b76700,0 0 9px #ffcb37;
    font-variant-numeric:tabular-nums;
  }
  .bank-value.bump{ animation:bankBump .34s ease-out; }
  @keyframes bankBump{0%{transform:scale(1)}45%{transform:scale(1.18);filter:brightness(1.6)}100%{transform:scale(1)}}

  .strike-slots{
    display:flex; gap:6px; justify-content:center; align-items:center;
    margin-top:7px;
  }
  .strike-slot{
    width:clamp(19px,6vw,31px);
    aspect-ratio:1;
    border-radius:50%;
    border:2px solid #ff9e00;
    background:#050b1e;
    box-shadow:inset 0 0 10px #000,0 0 6px #ff8c0088;
    display:grid;place-items:center;
    color:#ff273e;
    font-size:clamp(18px,5vw,28px);
    line-height:1;
  }
  .strike-slot.filled{
    animation:strikeSlotPop .48s cubic-bezier(.2,1.6,.3,1);
    background:radial-gradient(circle,#7d0716,#180006 72%);
    border-color:#ff5b2d;
    box-shadow:0 0 13px #ff1536,inset 0 0 8px #ff6400;
    text-shadow:0 0 7px #ff001f;
  }
  @keyframes strikeSlotPop{0%{transform:scale(.25) rotate(-20deg)}65%{transform:scale(1.3) rotate(5deg)}100%{transform:scale(1)}}

  .marquee-gap{pointer-events:none}

  /* ---------- prize wall ---------- */
  .wall-shell{
    position:relative;
    z-index:2;
    height:77.2%;
    padding:1.65% 18% 2.1%;
    background:
      linear-gradient(90deg, #071d6d 0 13%, #083dde 13% 15%, #040916 15% 85%, #083dde 85% 87%, #071d6d 87% 100%);
  }
  .wall-frame{
    height:100%;
    padding:3px;
    border:3px solid #ffb019;
    border-radius:7px 7px 2px 2px;
    background:linear-gradient(#5e2700,#160800);
    box-shadow:inset 0 0 0 2px #ffd969, 0 0 17px #000b;
  }
  .wall{
    position:relative;
    height:100%;
    display:grid;
    grid-template-rows:repeat(var(--panelCount), minmax(0,1fr));
    gap:1.15%;
    padding:1.15%;
    background:
      radial-gradient(circle at 50% 50%, #0b2b84 0, #020817 65%);
  }

  .panel{
    position:relative;
    min-height:0;
    perspective:900px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    outline:none;
    filter:drop-shadow(0 2px 1px #000c);
  }
  .panel[disabled]{
    cursor:default;
  }
  .panel-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform .62s cubic-bezier(.2,.72,.2,1);
  }
  .panel.open .panel-inner{ transform:rotateX(180deg); }

  .panel-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border:2px solid #ffb422;
    border-radius:7px;
    box-shadow:
      inset 0 0 0 2px #713000,
      inset 0 0 0 4px #ffdb66,
      inset 0 0 18px #0039b7,
      0 0 0 1px #120900;
    overflow:hidden;
    display:grid;
    place-items:center;
  }
  .panel-front{
    background:
      radial-gradient(circle at 50% 50%, #0b4acf 0 6%, #052a83 32%, #03154c 83%),
      linear-gradient(#0b3bc0,#03164e);
  }
  .panel-front::before,
  .panel-back::before{
    content:"";
    position:absolute; inset:9%;
    border-radius:4px;
    background:
      radial-gradient(circle at 1px 1px,#2d61ca55 1px,transparent 1.3px);
    background-size:7px 7px;
    opacity:.45;
  }
  .panel-front::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(95deg,transparent 0 36%,#ffffff18 47%,transparent 58%);
    transform:translateX(-140%);
  }
  .panel:hover:not([disabled]) .panel-front::after{animation:sheen .8s ease}
  @keyframes sheen{to{transform:translateX(160%)}}
  .panel:active:not([disabled]) .panel-inner{transform:scale(.975)}
  .panel.open:active .panel-inner{transform:rotateX(180deg)}

  .qmark{
    position:relative;
    z-index:2;
    width:min(18%,58px);
    aspect-ratio:1;
    border-radius:50%;
    display:grid;place-items:center;
    font-family:Arial Black,Arial,sans-serif;
    font-size:clamp(22px,6vw,37px);
    color:#e8f1ff;
    border:2px solid #8cc7ff;
    background:radial-gradient(circle at 40% 35%,#1d54dc,#061553 66%);
    box-shadow:0 0 10px #1f73ff, inset 0 0 8px #020b2b;
    text-shadow:0 0 7px #00aaff;
  }

  .panel-back{
    transform:rotateX(180deg);
    background:radial-gradient(circle at 50% 50%, #0b4fd7 0, #061a5b 68%, #02091d 100%);
  }
  .panel-back.reward{
    background:radial-gradient(circle at 50% 45%, #0d5ced 0, #08246d 60%, #02091d 100%);
  }
  .panel-back.strike{
    background:radial-gradient(circle at 50% 45%, #74101e 0, #27030c 54%, #060104 100%);
  }
  .reveal-content{
    position:relative;
    z-index:3;
    display:flex; align-items:center; justify-content:center;
    gap:8px;
    padding:0 10px;
    font-family:Arial Black, Arial, sans-serif;
    font-weight:900;
  }
  .coin{
    width:clamp(25px,7vw,40px);
    aspect-ratio:1;
    border-radius:50%;
    display:grid; place-items:center;
    color:#8a4800;
    font-size:clamp(14px,3.8vw,22px);
    background:radial-gradient(circle at 35% 30%,#fff6a8,#ffd338 45%,#f58600 75%);
    border:2px solid #fff3a6;
    box-shadow:0 0 10px #ffca2b, inset 0 -3px 0 #b85b00;
  }
  .amount{
    font-size:clamp(18px,5.5vw,34px);
    color:#fff4b9;
    text-shadow:0 2px 0 #9a4b00,0 0 8px #ffbc00;
  }
  .big-x{
    font-size:clamp(40px,12vw,76px);
    line-height:.8;
    color:#ff1c39;
    -webkit-text-stroke:2px #ffd1d8;
    text-shadow:0 4px 0 #68000e,0 0 14px #ff001d;
  }
  .large-win .amount{animation:largeWin 1s ease-out}
  .large-win .coin{animation:coinSpin 1s ease-out}
  @keyframes largeWin{0%{transform:scale(.5)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
  @keyframes coinSpin{0%{transform:rotateY(0) scale(.4)}100%{transform:rotateY(720deg) scale(1)}}

  .panel.tension:not(.open) .panel-face{
    animation:tensionGlow 1.05s ease-in-out infinite alternate;
  }
  @keyframes tensionGlow{
    from{box-shadow:inset 0 0 0 2px #713000,inset 0 0 0 4px #ffdb66,inset 0 0 16px #0039b7,0 0 2px #ff9c00}
    to{box-shadow:inset 0 0 0 2px #713000,inset 0 0 0 4px #ffdb66,inset 0 0 20px #ff002e55,0 0 11px #ff382c}
  }


  /* ---------- end-of-game unchosen reveals ---------- */
  .panel.missed{
    cursor:default;
    filter:grayscale(1) brightness(.58) contrast(1.08) drop-shadow(0 2px 1px #000c);
    opacity:.82;
  }
  .panel.missed .panel-back{
    background:radial-gradient(circle at 50% 50%, #6d7480 0, #30343c 58%, #111319 100%);
    border-color:#bfc3c9;
    box-shadow:
      inset 0 0 0 2px #555,
      inset 0 0 0 4px #d6d8db,
      inset 0 0 16px #0008,
      0 0 0 1px #111;
  }
  .panel.missed .coin{
    filter:grayscale(1);
    box-shadow:none;
  }
  .panel.missed .amount,
  .panel.missed .big-x{
    color:#e1e3e7;
    -webkit-text-stroke:1px #4b4e55;
    text-shadow:0 2px 0 #222;
  }
  .panel.missed .reveal-content::after{
    content:"UNCHOSEN";
    position:absolute;
    left:50%;
    bottom:-13px;
    transform:translateX(-50%);
    padding:1px 5px;
    border-radius:4px;
    background:#111b;
    color:#d8d8d8;
    font:700 clamp(7px,1.8vw,10px)/1 Arial,sans-serif;
    letter-spacing:.7px;
    white-space:nowrap;
  }

  /* ---------- fly particles ---------- */
  .fly-coin{
    position:fixed;
    width:18px;height:18px;border-radius:50%;
    display:grid;place-items:center;
    z-index:9999;
    pointer-events:none;
    color:#814400;
    font:bold 11px Arial;
    background:radial-gradient(circle at 35% 30%,#fff7a4,#ffc928 50%,#ed7600 78%);
    border:1px solid #fff0a0;
    box-shadow:0 0 6px #ffb900;
    animation:flyCoin .62s cubic-bezier(.2,.75,.25,1) forwards;
  }
  @keyframes flyCoin{
    0%{transform:translate(0,0) scale(.6) rotate(0);opacity:0}
    15%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.32) rotate(540deg);opacity:.15}
  }

  /* ---------- overlay ---------- */
  .end-overlay{
    position:absolute; inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:radial-gradient(circle at 50% 43%,#0a247ee8,#020611f4 68%);
    backdrop-filter:blur(3px);
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease;
  }
  .end-overlay.show{opacity:1;pointer-events:auto}
  .end-card{
    width:88%;
    border:3px solid #ffb51d;
    border-radius:18px;
    padding:22px 16px 18px;
    text-align:center;
    background:linear-gradient(#0b2c8c,#040c2b 68%);
    box-shadow:inset 0 0 0 3px #6e2c00,0 0 30px #000;
    transform:scale(.8);
    transition:transform .32s cubic-bezier(.2,1.5,.3,1);
  }
  .end-overlay.show .end-card{transform:scale(1)}
  .end-title{
    font-size:clamp(36px,10vw,62px);
    line-height:.9;
    color:#fff2c6;
    background:linear-gradient(#fffbea,#ffc42f 55%,#ff8600);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:1.5px #392000;
    filter:drop-shadow(0 4px 0 #5b2300);
  }
  .end-overlay.fail .end-title{
    background:linear-gradient(#fff,#ff3a4e 58%,#b00018);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .end-copy{
    margin-top:12px;
    font-family:Arial Black,Arial,sans-serif;
    color:#d7e5ff;
    font-size:14px;
  }
  .final-bank{
    margin:6px 0 15px;
    font-size:clamp(38px,10vw,62px);
    color:#fff1a8;
    text-shadow:0 0 14px #ffb700;
  }
  .collect{
    border:2px solid #fff0a6;
    border-radius:10px;
    padding:12px 28px;
    min-width:64%;
    background:linear-gradient(#ffd34c,#ff8a00);
    color:#1c1100;
    font-family:Arial Black,Arial,sans-serif;
    font-size:18px;
    box-shadow:0 5px 0 #8a3d00,0 0 16px #ffc21f77;
    cursor:pointer;
  }
  .collect:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3d00}

  /* ---------- debug ---------- */
  .debug{
    position:fixed;
    left:50%; bottom:8px;
    transform:translateX(-50%);
    z-index:10000;
    display:flex;
    gap:6px;
    align-items:center;
    padding:6px 8px;
    background:#050914e8;
    border:1px solid #4d5c82;
    border-radius:10px;
    font:12px/1 Arial,sans-serif;
    color:#c9d4f2;
    box-shadow:0 4px 15px #0008;
  }
  .debug button,.debug select{
    border:1px solid #66769e;
    background:#10182e;
    color:#eaf0ff;
    border-radius:6px;
    padding:6px 8px;
    font:12px Arial,sans-serif;
  }
  .debug button.active{outline:2px solid #ffc21f}
  .debug .tiny{opacity:.65;white-space:nowrap}
  @media (max-width:430px){
    body{padding:0 0 54px}
    .stage{width:100vw;height:min(100svh - 54px, 177.78vw);border-radius:0}
    .debug{width:100%;justify-content:center;border-radius:0;bottom:0}
  }
</style>
</head>
<body>

<div class="stage" id="stage" aria-label="Strike Out Prize Wall game">
  <section class="marquee">
    <div class="marquee-rim"></div>
    <div class="bulbs" aria-hidden="true" id="bulbs"></div>

    <div class="title-wrap">
      <h1 class="title"><span class="strike">STRIKE</span><span>OUT</span></h1>
      <div class="subtitle">PRIZE WALL</div>
    </div>

    <div class="hud">
      <div class="hudbox">
        <div class="hudlabel">BANK</div>
        <div class="bank-value" id="bank">$0</div>
      </div>
      <div class="marquee-gap"></div>
      <div class="hudbox">
        <div class="hudlabel">STRIKES</div>
        <div class="strike-slots" id="strikeSlots"></div>
      </div>
    </div>
  </section>

  <section class="wall-shell">
    <div class="wall-frame">
      <div class="wall" id="wall"></div>
    </div>
  </section>

  <div class="end-overlay" id="endOverlay">
    <div class="end-card">
      <div class="end-title" id="endTitle">STRIKE OUT!</div>
      <div class="end-copy">FINAL BANK</div>
      <div class="final-bank" id="finalBank">$0</div>
      <button class="collect" id="collectBtn">COLLECT</button>
    </div>
  </div>
</div>

<div class="debug">
  <span class="tiny">DEV</span>
  <button id="restartBtn">Restart</button>
  <button id="forceRewardBtn" title="Next tap will reveal a reward">Force Reward</button>
  <button id="forceStrikeBtn" title="Next tap will reveal a strike">Force Strike</button>
  <select id="preset" title="Quick tuning presets — default is 10 doors / 3 strikes">
    <option value="10/3" selected>10 panels / 3 strikes</option>
    <option value="8/3">8 panels / 3 strikes</option>
    <option value="8/2">8 panels / 2 strikes</option>
  </select>
</div>

<script>
const CONFIG = {
  panelCount: 10,
  strikeCount: 3,
  rewards: {
    small: 5000,
    medium: 15000,
    large: 50000
  },
  // The wall contains CONFIG.strikeCount X panels.
  // All other panels are rewards; finding every reward before the 3rd X wins.
  // For reward panels after the guaranteed single Large prize:
  rewardWeights: { small: 0.55, medium: 0.45 },
  revealMs: 620,
  endDelayMs: 620
};

let state = {
  bank: 0,
  strikes: 0,
  revealed: 0,
  rewardsFound: 0,
  totalRewards: 0,
  ended: false,
  panels: [],
  forcedNext: null
};

const $ = s => document.querySelector(s);
const stage = $("#stage");
const wall = $("#wall");
const bankEl = $("#bank");
const strikeSlots = $("#strikeSlots");
const endOverlay = $("#endOverlay");
const endTitle = $("#endTitle");
const finalBank = $("#finalBank");
const forceRewardBtn = $("#forceRewardBtn");
const forceStrikeBtn = $("#forceStrikeBtn");

function money(n){ return "$" + Math.round(n).toLocaleString("en-US"); }

function buildBulbs(){
  const host = $("#bulbs");
  host.innerHTML = "";
  for(let i=0;i<18;i++){
    const b=document.createElement("span");
    b.className="bulb";
    host.appendChild(b);
  }
}

function weightedReward(){
  const r = Math.random();
  return r < CONFIG.rewardWeights.small
    ? {type:"reward", tier:"small", value:CONFIG.rewards.small}
    : {type:"reward", tier:"medium", value:CONFIG.rewards.medium};
}

function makeOutcomes(){
  const out=[];
  const strikes = Math.min(CONFIG.strikeCount, CONFIG.panelCount-1);
  for(let i=0;i<strikes;i++) out.push({type:"strike"});
  const rewardSlots = CONFIG.panelCount - strikes;
  if(rewardSlots > 0) out.push({type:"reward", tier:"large", value:CONFIG.rewards.large});
  while(out.length < CONFIG.panelCount) out.push(weightedReward());

  // Fisher-Yates shuffle
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

function buildStrikeSlots(){
  strikeSlots.innerHTML="";
  for(let i=0;i<CONFIG.strikeCount;i++){
    const s=document.createElement("div");
    s.className="strike-slot";
    s.setAttribute("aria-label", `Strike slot ${i+1}`);
    strikeSlots.appendChild(s);
  }
}

function buildPanels(){
  document.documentElement.style.setProperty("--panelCount", CONFIG.panelCount);
  wall.innerHTML="";
  state.panels = makeOutcomes();
  state.totalRewards = state.panels.filter(o => o.type === "reward").length;
  state.panels.forEach((outcome, index)=>{
    const btn=document.createElement("button");
    btn.className="panel";
    btn.type="button";
    btn.setAttribute("aria-label", `Mystery prize panel ${index+1}`);
    btn.dataset.index=index;
    btn.innerHTML=`
      <span class="panel-inner">
        <span class="panel-face panel-front"><span class="qmark">?</span></span>
        <span class="panel-face panel-back"><span class="reveal-content"></span></span>
      </span>`;
    btn.addEventListener("click", ()=>revealPanel(btn));
    wall.appendChild(btn);
  });
}

function setForced(mode){
  state.forcedNext = state.forcedNext===mode ? null : mode;
  forceRewardBtn.classList.toggle("active", state.forcedNext==="reward");
  forceStrikeBtn.classList.toggle("active", state.forcedNext==="strike");
}

function chooseForcedOutcome(index){
  if(!state.forcedNext) return state.panels[index];
  const wanted=state.forcedNext;
  state.forcedNext=null;
  forceRewardBtn.classList.remove("active");
  forceStrikeBtn.classList.remove("active");

  if(wanted==="strike"){
    return {type:"strike"};
  }
  // Reward force prefers medium; avoids forcing Large too often.
  return {type:"reward", tier:"medium", value:CONFIG.rewards.medium};
}


function renderOutcomeOnPanel(btn, outcome, missed=false){
  const back=btn.querySelector(".panel-back");
  const content=btn.querySelector(".reveal-content");

  back.classList.remove("reward","strike");
  content.classList.remove("large-win");

  if(outcome.type==="strike"){
    back.classList.add("strike");
    content.innerHTML=`<span class="big-x">X</span>`;
  }else{
    back.classList.add("reward");
    if(outcome.tier==="large" && !missed) content.classList.add("large-win");
    content.innerHTML=`<span class="coin">$</span><span class="amount">${money(outcome.value)}</span>`;
  }

  if(missed) btn.classList.add("missed");
}

function revealUnchosenPanels(){
  const remaining=[...document.querySelectorAll(".panel:not(.open)")];
  remaining.forEach((btn, i)=>{
    btn.disabled=true;
    btn.classList.remove("tension");
    const outcome=state.panels[Number(btn.dataset.index)];
    setTimeout(()=>{
      renderOutcomeOnPanel(btn, outcome, true);
      btn.classList.add("open");
    }, i*85);
  });
  return remaining.length;
}

function revealPanel(btn){
  if(state.ended || btn.disabled || btn.classList.contains("open")) return;
  btn.disabled=true;

  const index=Number(btn.dataset.index);
  const outcome=chooseForcedOutcome(index);
  renderOutcomeOnPanel(btn, outcome, false);

  // Slight press beat, then door flips open.
  requestAnimationFrame(()=>btn.classList.add("open"));
  state.revealed++;

  setTimeout(()=>{
    if(outcome.type==="strike") resolveStrike(btn);
    else resolveReward(btn,outcome);
  }, Math.min(330, CONFIG.revealMs/2));
}

function resolveReward(btn,outcome){
  stage.classList.remove("reward-flash");
  void stage.offsetWidth;
  stage.classList.add("reward-flash");
  setTimeout(()=>stage.classList.remove("reward-flash"),430);

  flyCoins(btn, outcome.tier==="large" ? 12 : 7);
  animateBank(state.bank, state.bank + outcome.value, outcome.tier==="large" ? 700 : 480);
  state.bank += outcome.value;
  state.rewardsFound++;

  if(state.rewardsFound >= state.totalRewards && !state.ended){
    finishGame(true);
  }
}

function resolveStrike(btn){
  state.strikes++;
  stage.classList.remove("strike-flash");
  void stage.offsetWidth;
  stage.classList.add("strike-flash");
  setTimeout(()=>stage.classList.remove("strike-flash"),500);

  const slots=[...strikeSlots.children];
  if(slots[state.strikes-1]){
    slots[state.strikes-1].textContent="X";
    slots[state.strikes-1].classList.add("filled");
  }

  // Camera/board impact grows with each strike.
  const magnitude = state.strikes===1 ? 2 : state.strikes===2 ? 4 : 7;
  stage.animate([
    {transform:"translate(0,0)"},
    {transform:`translate(${magnitude}px,-${magnitude/2}px)`},
    {transform:`translate(-${magnitude}px,${magnitude/2}px)`},
    {transform:"translate(0,0)"}
  ], {duration: state.strikes===3 ? 380 : 250, iterations:1});

  if(state.strikes >= 2 && state.strikes < CONFIG.strikeCount){
    document.querySelectorAll(".panel:not(.open)").forEach(p=>p.classList.add("tension"));
  }

  if(state.strikes >= CONFIG.strikeCount){
    finishGame(false);
  }
}

function animateBank(from,to,duration){
  const start=performance.now();
  const tick=(now)=>{
    const t=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-t,3);
    bankEl.textContent=money(from+(to-from)*eased);
    if(t<1) requestAnimationFrame(tick);
    else{
      bankEl.textContent=money(to);
      bankEl.classList.remove("bump");
      void bankEl.offsetWidth;
      bankEl.classList.add("bump");
    }
  };
  requestAnimationFrame(tick);
}

function flyCoins(source,count){
  const s=source.getBoundingClientRect();
  const b=bankEl.getBoundingClientRect();
  const sx=s.left+s.width/2, sy=s.top+s.height/2;
  const tx=b.left+b.width/2, ty=b.top+b.height/2;

  for(let i=0;i<count;i++){
    const c=document.createElement("div");
    c.className="fly-coin";
    c.textContent="$";
    const jitterX=(Math.random()-.5)*60;
    const jitterY=(Math.random()-.5)*22;
    c.style.left=(sx-9+jitterX)+"px";
    c.style.top=(sy-9+jitterY)+"px";
    c.style.setProperty("--dx",(tx-(sx+jitterX))+"px");
    c.style.setProperty("--dy",(ty-(sy+jitterY))+"px");
    c.style.animationDelay=(i*22)+"ms";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),900);
  }
}

function finishGame(perfect){
  if(state.ended) return;
  state.ended=true;

  // Show the player's missed choices before presenting the result.
  // These doors flip in muted grayscale so they read as outcomes the player did NOT select.
  const remainingCount = revealUnchosenPanels();
  const revealTime = remainingCount ? ((remainingCount - 1) * 85 + CONFIG.revealMs + 240) : 260;

  setTimeout(()=>{
    finalBank.textContent=money(state.bank);
    endOverlay.classList.toggle("fail", !perfect);
    endTitle.textContent=perfect ? "PERFECT WALL!" : "STRIKE OUT!";
    $("#collectBtn").textContent="COLLECT";
    endOverlay.classList.add("show");
    if(perfect){
      // celebratory pulse
      stage.animate([
        {filter:"brightness(1)"},
        {filter:"brightness(1.28)"},
        {filter:"brightness(1)"}
      ],{duration:700});
    }
  }, revealTime);
}

function restart(){
  state={bank:0,strikes:0,revealed:0,rewardsFound:0,totalRewards:0,ended:false,panels:[],forcedNext:null};
  bankEl.textContent="$0";
  bankEl.classList.remove("bump");
  endOverlay.classList.remove("show","fail");
  forceRewardBtn.classList.remove("active");
  forceStrikeBtn.classList.remove("active");
  buildStrikeSlots();
  buildPanels();
}

$("#restartBtn").addEventListener("click",restart);
$("#collectBtn").addEventListener("click",restart);
forceRewardBtn.addEventListener("click",()=>setForced("reward"));
forceStrikeBtn.addEventListener("click",()=>setForced("strike"));

$("#preset").addEventListener("change",(e)=>{
  const [p,s]=e.target.value.split("/").map(Number);
  CONFIG.panelCount=p;
  CONFIG.strikeCount=s;
  restart();
});

buildBulbs();
restart();
</script>
</body>
</html>
